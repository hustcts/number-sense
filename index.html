<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Sense - 数感大挑战</title>
    <meta name="description" content="通过游戏化方式培养 K12 学生的数感能力">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6c5ce7;
            --secondary: #00b894;
            --warning: #fdcb6e;
            --danger: #ff7675;
            --dark: #2d3436;
            --light: #dfe6e9;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #game-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }

        /* Header */
        #game-header {
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-stats {
            display: flex;
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }

        /* 奖励展示区 */
        #rewards-bar {
            background: linear-gradient(90deg, #fdcb6e, #f39c12);
            padding: 10px 20px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .reward-item {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.3);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }

        /* 主游戏区 */
        #game-area {
            padding: 30px;
            min-height: 400px;
        }

        /* 开始屏幕 */
        #start-screen, #level-complete, #game-over {
            text-align: center;
            padding: 40px 20px;
        }

        #start-screen h1 {
            font-size: 48px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .mode-select {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .mode-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border: 3px solid transparent;
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.2);
        }

        .mode-card.selected {
            border-color: var(--secondary);
            background: linear-gradient(135deg, #e8f8f5, #d1f2eb);
        }

        .mode-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .mode-title {
            font-size: 18px;
            font-weight: bold;
            color: var(--dark);
            margin-bottom: 5px;
        }

        .mode-desc {
            font-size: 14px;
            color: #666;
        }

        .btn {
            padding: 15px 40px;
            font-size: 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), #a29bfe);
            color: white;
        }

        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
        }

        .btn-secondary {
            background: linear-gradient(135deg, var(--secondary), #55efc4);
            color: white;
        }

        /* 游戏界面 */
        #game-ui {
            display: none;
        }

        .question-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .question-text {
            font-size: 32px;
            color: var(--dark);
            margin-bottom: 20px;
        }

        .visual-area {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 30px 0;
            flex-wrap: wrap;
        }

        .visual-box {
            background: #f8f9fa;
            border: 3px solid var(--primary);
            border-radius: 15px;
            padding: 20px;
            min-width: 200px;
        }

        .dot-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 15px 0;
        }

        .dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--primary);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 30px 0;
        }

        .option-btn {
            padding: 20px;
            font-size: 24px;
            border: 3px solid var(--light);
            border-radius: 15px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #f8f9fa;
        }

        .option-btn.correct {
            background: var(--secondary);
            border-color: var(--secondary);
            color: white;
            animation: celebrate 0.5s ease;
        }

        .option-btn.wrong {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
            animation: shake 0.5s ease;
        }

        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* 连对奖励动画 */
        .streak-bonus {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 72px;
            font-weight: bold;
            color: #f39c12;
            text-shadow: 0 0 20px rgba(243, 156, 18, 0.8);
            z-index: 1000;
            animation: streakPop 1s ease forwards;
            pointer-events: none;
        }

        @keyframes streakPop {
            0% {
                transform: translate(-50%, -50%) scale(0.5);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.3);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }

        /* 粒子效果 */
        .particle {
            position: fixed;
            width: 15px;
            height: 15px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 999;
            animation: particleExplode 0.8s ease forwards;
        }

        @keyframes particleExplode {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        /* 分数增加动画 */
        .score-popup {
            position: absolute;
            font-size: 28px;
            font-weight: bold;
            color: var(--secondary);
            animation: scoreFloat 1s ease forwards;
            pointer-events: none;
        }

        @keyframes scoreFloat {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-50px) scale(1.5);
                opacity: 0;
            }
        }

        /* 进度条 */
        .progress-container {
            background: var(--light);
            border-radius: 10px;
            height: 20px;
            overflow: hidden;
            margin: 20px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--secondary), #55efc4);
            transition: width 0.5s ease;
            border-radius: 10px;
        }

        /* 奖励动画 */
        #reward-animation {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 100px;
            z-index: 1000;
            display: none;
            animation: rewardPop 1s ease;
        }

        @keyframes rewardPop {
            0% {
                transform: translate(-50%, -50%) scale(0);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.2);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0;
            }
        }

        /* 徽章展示 */
        #badge-collection {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        .badge {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f39c12, #f1c40f);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            opacity: 0.3;
            transition: all 0.3s;
        }

        .badge.earned {
            opacity: 1;
            animation: badgeGlow 2s ease infinite;
        }

        @keyframes badgeGlow {
            0%, 100% {
                box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
            }
            50% {
                box-shadow: 0 5px 25px rgba(243, 156, 18, 0.8);
            }
        }

        /* 难度选择 */
        .difficulty-select {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }

        .difficulty-btn {
            padding: 10px 20px;
            border: 2px solid var(--primary);
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .difficulty-btn:hover,
        .difficulty-btn.active {
            background: var(--primary);
            color: white;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            #game-header {
                flex-direction: column;
                gap: 15px;
            }

            .header-stats {
                gap: 15px;
            }

            .stat-value {
                font-size: 20px;
            }

            #start-screen h1 {
                font-size: 32px;
            }

            .question-text {
                font-size: 24px;
            }

            .mode-select {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 头部 -->
        <div id="game-header">
            <div>
                <h2>🔢 数感大挑战</h2>
                <p style="opacity: 0.9;">Number Sense Challenge</p>
            </div>
            <div class="header-stats">
                <div class="stat-item">
                    <div class="stat-label">关卡</div>
                    <div class="stat-value" id="level-display">1</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">得分</div>
                    <div class="stat-value" id="score-display">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">连对</div>
                    <div class="stat-value" id="streak-display">0</div>
                </div>
            </div>
        </div>

        <!-- 奖励栏 -->
        <div id="rewards-bar">
            <div class="reward-item">
                <span>⭐</span>
                <span id="stars-count">0</span>
            </div>
            <div class="reward-item">
                <span>🏆</span>
                <span id="trophies-count">0</span>
            </div>
            <div class="reward-item">
                <span>💎</span>
                <span id="gems-count">0</span>
            </div>
        </div>

        <!-- 游戏区域 -->
        <div id="game-area">
            <!-- 开始屏幕 -->
            <div id="start-screen">
                <h1>🔢 数感大挑战</h1>
                <p class="subtitle">通过游戏培养数学直觉，成为数感大师！</p>

                <h3 style="margin: 20px 0; color: var(--primary);">选择游戏模式</h3>
                <div class="mode-select">
                    <div class="mode-card" data-mode="association">
                        <div class="mode-icon">💡</div>
                        <div class="mode-title">数字联想</div>
                        <div class="mode-desc">快速想到相关数字</div>
                    </div>
                    <div class="mode-card" data-mode="sudoku">
                        <div class="mode-icon">🔲</div>
                        <div class="mode-title">数独挑战</div>
                        <div class="mode-desc">经典逻辑数字游戏</div>
                    </div>
                    <div class="mode-card" data-mode="calculate">
                        <div class="mode-icon">🧮</div>
                        <div class="mode-title">快速计算</div>
                        <div class="mode-desc">心算小能手</div>
                    </div>
                    <div class="mode-card" data-mode="sequence">
                        <div class="mode-icon">🔢</div>
                        <div class="mode-title">数字规律</div>
                        <div class="mode-desc">找出下一个数字</div>
                    </div>
                </div>

                <h3 style="margin: 20px 0; color: var(--primary);">选择难度</h3>
                <div class="difficulty-select">
                    <button class="difficulty-btn active" data-difficulty="easy">简单</button>
                    <button class="difficulty-btn" data-difficulty="medium">中等</button>
                    <button class="difficulty-btn" data-difficulty="hard">困难</button>
                </div>

                <button class="btn btn-primary" id="start-btn" style="margin-top: 30px;">
                    🚀 开始挑战
                </button>

                <div style="margin-top: 30px;">
                    <h4>🏅 我的徽章</h4>
                    <div id="badge-collection">
                        <div class="badge" id="badge-1" title="初出茅庐">🌱</div>
                        <div class="badge" id="badge-2" title="渐入佳境">📚</div>
                        <div class="badge" id="badge-3" title="数学达人">⭐</div>
                        <div class="badge" id="badge-4" title="数感大师">🏆</div>
                        <div class="badge" id="badge-5" title="传奇之路">👑</div>
                    </div>
                </div>
            </div>

            <!-- 游戏界面 -->
            <div id="game-ui">
                <div class="progress-container">
                    <div class="progress-bar" id="progress-bar" style="width: 0%;"></div>
                </div>
                <p style="text-align: center; color: #666;">
                    进度：<span id="progress-text">0/10</span>
                </p>

                <div class="question-area">
                    <div class="question-text" id="question-text">问题加载中...</div>
                </div>

                <div class="visual-area" id="visual-area"></div>

                <div class="options-grid" id="options-area"></div>
            </div>

            <!-- 关卡完成 -->
            <div id="level-complete" style="display: none;">
                <h1 style="font-size: 48px; color: var(--secondary);">🎉 太棒了！</h1>
                <p class="subtitle">关卡完成！</p>
                
                <div style="background: linear-gradient(135deg, #f8f9fa, #e9ecef); padding: 30px; border-radius: 15px; margin: 20px 0;">
                    <h3>本关奖励</h3>
                    <div style="display: flex; justify-content: center; gap: 30px; margin: 20px 0;">
                        <div style="text-align: center;">
                            <div style="font-size: 48px;">⭐</div>
                            <div style="font-size: 24px; font-weight: bold;" id="level-stars">3</div>
                        </div>
                        <div style="text-align: center;">
                            <div style="font-size: 48px;">💎</div>
                            <div style="font-size: 24px; font-weight: bold;" id="level-gems">10</div>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 20px; justify-content: center; margin-top: 30px;">
                    <button class="btn btn-secondary" id="next-level-btn">下一关 ▶</button>
                    <button class="btn btn-primary" id="back-menu-btn">🏠 返回菜单</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 奖励动画 -->
    <div id="reward-animation"></div>

    <script>
        // 游戏状态
        const gameState = {
            mode: 'estimate',
            difficulty: 'easy',
            level: 1,
            score: 0,
            streak: 0,
            stars: 0,
            trophies: 0,
            gems: 0,
            badges: [],
            currentQuestion: 0,
            totalQuestions: 10,
            correctAnswers: 0
        };

        // DOM 元素
        const startScreen = document.getElementById('start-screen');
        const gameUI = document.getElementById('game-ui');
        const levelComplete = document.getElementById('level-complete');
        const questionText = document.getElementById('question-text');
        const visualArea = document.getElementById('visual-area');
        const optionsArea = document.getElementById('options-area');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');

        // 难度配置
        const difficultyConfig = {
            easy: { maxNumber: 10, timeLimit: 30 },
            medium: { maxNumber: 50, timeLimit: 20 },
            hard: { maxNumber: 100, timeLimit: 10 }
        };

        // 初始化
        function init() {
            // 模式选择
            document.querySelectorAll('.mode-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll('.mode-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    gameState.mode = card.dataset.mode;
                });
            });

            // 难度选择
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    gameState.difficulty = btn.dataset.difficulty;
                });
            });

            // 开始按钮
            document.getElementById('start-btn').addEventListener('click', startGame);
            document.getElementById('next-level-btn').addEventListener('click', nextLevel);
            document.getElementById('back-menu-btn').addEventListener('click', backToMenu);

            // 加载进度
            loadProgress();
            updateRewardsDisplay();
        }

        // 开始游戏
        function startGame() {
            startScreen.style.display = 'none';
            gameUI.style.display = 'block';
            gameState.currentQuestion = 0;
            gameState.correctAnswers = 0;
            generateQuestion();
        }

        // 生成问题
        function generateQuestion() {
            gameState.currentQuestion++;
            updateProgress();

            if (gameState.currentQuestion > gameState.totalQuestions) {
                completeLevel();
                return;
            }

            const config = difficultyConfig[gameState.difficulty];
            
            switch (gameState.mode) {
                case 'sudoku':
                    generateSudokuQuestion(config);
                    break;
                case 'calculate':
                    generateCalculateQuestion(config);
                    break;
                case 'sequence':
                    generateSequenceQuestion(config);
                    break;
                case 'association':
                    generateAssociationQuestion(config);
                    break;
            }
        }

        // 数独游戏 - 生成题目
        let currentSudoku = null;
        let sudokuAnswer = null;
        
        function generateSudokuQuestion(config) {
            // 难度对应的空格数量
            const emptyCount = {
                easy: 20,
                medium: 35,
                hard: 45
            }[gameState.difficulty] || 20;
            
            questionText.textContent = `填入正确的数字（1-9）`;
            
            // 生成完整的数独解决方案
            const solution = generateSudokuSolution();
            
            // 创建题目（挖空）
            const puzzle = JSON.parse(JSON.stringify(solution));
            let removed = 0;
            while (removed < emptyCount) {
                const row = Math.floor(Math.random() * 9);
                const col = Math.floor(Math.random() * 9);
                if (puzzle[row][col] !== 0) {
                    puzzle[row][col] = 0;
                    removed++;
                }
            }
            
            currentSudoku = puzzle;
            sudokuAnswer = solution;
            
            // 找到第一个空格作为当前问题
            let firstEmpty = null;
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    if (puzzle[r][c] === 0 && !firstEmpty) {
                        firstEmpty = { row: r, col: c };
                    }
                }
            }
            
            // 渲染数独网格
            renderSudoku(puzzle, firstEmpty);
            
            // 生成选项（正确答案 + 干扰项）
            const correctAnswer = solution[firstEmpty.row][firstEmpty.col];
            const options = generateSudokuOptions(correctAnswer);
            renderOptions(options, correctAnswer);
        }
        
        // 生成完整的数独解决方案
        function generateSudokuSolution() {
            const board = Array(9).fill(null).map(() => Array(9).fill(0));
            fillSudoku(board);
            return board;
        }
        
        // 回溯法填充数独
        function fillSudoku(board) {
            for (let row = 0; row < 9; row++) {
                for (let col = 0; col < 9; col++) {
                    if (board[row][col] === 0) {
                        const nums = [1, 2, 3, 4, 5, 6, 7, 8, 9].sort(() => Math.random() - 0.5);
                        for (let num of nums) {
                            if (isValidSudoku(board, row, col, num)) {
                                board[row][col] = num;
                                if (fillSudoku(board)) return true;
                                board[row][col] = 0;
                            }
                        }
                        return false;
                    }
                }
            }
            return true;
        }
        
        // 检查数独是否有效
        function isValidSudoku(board, row, col, num) {
            // 检查行
            for (let c = 0; c < 9; c++) {
                if (board[row][c] === num) return false;
            }
            // 检查列
            for (let r = 0; r < 9; r++) {
                if (board[r][col] === num) return false;
            }
            // 检查 3x3 宫格
            const startRow = Math.floor(row / 3) * 3;
            const startCol = Math.floor(col / 3) * 3;
            for (let r = startRow; r < startRow + 3; r++) {
                for (let c = startCol; c < startCol + 3; c++) {
                    if (board[r][c] === num) return false;
                }
            }
            return true;
        }
        
        // 渲染数独网格
        function renderSudoku(puzzle, currentCell) {
            let html = '<div style="display: inline-block; padding: 10px; background: #2d3436; border-radius: 10px;">';
            html += '<div style="display: grid; grid-template-columns: repeat(9, 40px); gap: 1px; background: #2d3436;">';
            
            for (let r = 0; r < 9; r++) {
                for (let c = 0; c < 9; c++) {
                    const isCurrent = currentCell && r === currentCell.row && c === currentCell.col;
                    const value = puzzle[r][c];
                    const borderRight = (c + 1) % 3 === 0 && c < 8 ? 'margin-right: 3px;' : '';
                    const borderBottom = (r + 1) % 3 === 0 && r < 8 ? 'margin-bottom: 3px;' : '';
                    
                    html += `<div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; 
                        background: ${isCurrent ? '#6c5ce7' : 'white'}; 
                        color: ${value !== 0 && !isCurrent ? '#2d3436' : (isCurrent ? 'white' : 'transparent')};
                        font-weight: bold; font-size: 18px; border-radius: 3px; ${borderRight} ${borderBottom}">`;
                    html += value !== 0 ? value : (isCurrent ? '?' : '');
                    html += '</div>';
                }
            }
            
            html += '</div></div>';
            visualArea.innerHTML = html;
        }
        
        // 生成数独选项
        function generateSudokuOptions(correct) {
            const options = new Set([correct]);
            while (options.size < 4) {
                const num = Math.floor(Math.random() * 9) + 1;
                if (num !== correct) {
                    options.add(num);
                }
            }
            return Array.from(options).sort(() => Math.random() - 0.5);
        }

        // 生成计算题
        function generateCalculateQuestion(config) {
            const num1 = Math.floor(Math.random() * config.maxNumber / 2) + 1;
            const num2 = Math.floor(Math.random() * config.maxNumber / 2) + 1;
            const operators = ['+', '-'];
            const operator = operators[Math.floor(Math.random() * operators.length)];
            
            let question, answer;
            if (operator === '+') {
                question = `${num1} + ${num2} = ?`;
                answer = num1 + num2;
            } else {
                const max = Math.max(num1, num2);
                const min = Math.min(num1, num2);
                question = `${max} - ${min} = ?`;
                answer = max - min;
            }
            
            questionText.textContent = question;
            visualArea.innerHTML = '';

            const options = generateOptions(answer, config.maxNumber);
            renderOptions(options, answer);
        }

        // 生成序列题
        function generateSequenceQuestion(config) {
            const start = Math.floor(Math.random() * 10) + 1;
            const step = Math.floor(Math.random() * 5) + 1;
            const sequence = [start, start + step, start + step * 2, start + step * 3];
            const answer = start + step * 4;
            
            questionText.textContent = `找出规律，下一个数字是？`;
            visualArea.innerHTML = `
                <div class="visual-box">
                    <h4>数字序列</h4>
                    <div style="font-size: 36px; font-weight: bold; color: var(--primary);">
                        ${sequence.join(' → ')} → ?
                    </div>
                </div>
            `;

            const options = generateOptions(answer, config.maxNumber);
            renderOptions(options, answer);
        }

        // 生成数字联想题
        function generateAssociationQuestion(config) {
            // 联想类型：平方、倍数、特殊乘积
            const types = ['square', 'multiply6', 'multiply7', 'multiply8', 'multiply9'];
            const type = types[Math.floor(Math.random() * types.length)];
            
            let num, answer, question, relation;
            
            switch (type) {
                case 'square':
                    // 平方数：15→225, 12→144
                    num = Math.floor(Math.random() * 12) + 10; // 10-21
                    answer = num * num;
                    relation = '平方';
                    break;
                case 'multiply6':
                    // 6 的倍数：13→78, 14→84
                    num = Math.floor(Math.random() * 15) + 10; // 10-24
                    answer = num * 6;
                    relation = '×6';
                    break;
                case 'multiply7':
                    // 7 的倍数：11→77, 12→84
                    num = Math.floor(Math.random() * 12) + 8; // 8-19
                    answer = num * 7;
                    relation = '×7';
                    break;
                case 'multiply8':
                    // 8 的倍数：10→80, 11→88
                    num = Math.floor(Math.random() * 10) + 8; // 8-17
                    answer = num * 8;
                    relation = '×8';
                    break;
                case 'multiply9':
                    // 9 的倍数：10→90, 11→99
                    num = Math.floor(Math.random() * 10) + 8; // 8-17
                    answer = num * 9;
                    relation = '×9';
                    break;
            }
            
            questionText.textContent = `看到 ${num}，想到什么数字？`;
            
            visualArea.innerHTML = `
                <div class="visual-box">
                    <h4>数字联想</h4>
                    <div style="font-size: 72px; font-weight: bold; color: var(--primary); margin: 20px 0;">${num}</div>
                    <div style="font-size: 48px; color: var(--secondary);">↓</div>
                    <div style="font-size: 24px; color: #666;">?</div>
                </div>
            `;

            // 生成干扰选项（接近正确答案）
            const options = new Set([answer]);
            while (options.size < 4) {
                // 生成接近的答案作为干扰
                const offset = (Math.floor(Math.random() * 5) + 1) * (Math.random() > 0.5 ? 1 : -1);
                const option = answer + offset;
                if (option > 0 && option !== answer) {
                    options.add(option);
                }
            }
            
            renderOptions(Array.from(options).sort(() => Math.random() - 0.5), answer);
        }

        // 生成选项
        function generateOptions(correct, maxRange) {
            const options = new Set([correct]);
            while (options.size < 4) {
                const offset = Math.floor(Math.random() * 10) - 5;
                const option = Math.max(1, correct + offset);
                if (option !== correct) {
                    options.add(option);
                }
            }
            return Array.from(options).sort(() => Math.random() - 0.5);
        }

        // 渲染选项
        function renderOptions(options, correct) {
            optionsArea.innerHTML = '';
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.textContent = option;
                btn.addEventListener('click', () => checkAnswer(option, correct, btn));
                optionsArea.appendChild(btn);
            });
        }

        // 检查答案
        function checkAnswer(selected, correct, btn) {
            // 禁用所有按钮
            document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

            if (selected === correct) {
                btn.classList.add('correct');
                gameState.correctAnswers++;
                gameState.streak++;
                const points = 10 * gameState.streak;
                gameState.score += points;
                
                // 即时奖励反馈
                showReward('⭐');
                createParticles(btn);
                showScorePopup(points);
                
                // 连对奖励
                if (gameState.streak >= 3) {
                    showStreakBonus(gameState.streak);
                }
            } else {
                btn.classList.add('wrong');
                gameState.streak = 0;
                // 显示正确答案
                document.querySelectorAll('.option-btn').forEach(b => {
                    if (b.textContent == correct) {
                        b.classList.add('correct');
                    }
                });
            }

            updateStats();
            setTimeout(generateQuestion, 1500);
        }

        // 显示奖励动画
        function showReward(emoji) {
            const anim = document.getElementById('reward-animation');
            anim.textContent = emoji;
            anim.style.display = 'block';
            setTimeout(() => {
                anim.style.display = 'none';
            }, 1000);
        }

        // 创建粒子爆炸效果
        function createParticles(element) {
            const rect = element.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const colors = ['#f39c12', '#e74c3c', '#3498db', '#2ecc71', '#9b59b6'];

            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = centerX + 'px';
                particle.style.top = centerY + 'px';
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                // 随机方向
                const angle = (i / 12) * Math.PI * 2;
                const distance = 100 + Math.random() * 100;
                particle.style.setProperty('--tx', Math.cos(angle) * distance + 'px');
                particle.style.setProperty('--ty', Math.sin(angle) * distance + 'px');
                
                document.body.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 800);
            }
        }

        // 显示分数增加弹窗
        function showScorePopup(points) {
            const popup = document.createElement('div');
            popup.className = 'score-popup';
            popup.textContent = '+' + points;
            popup.style.left = '50%';
            popup.style.top = '40%';
            document.body.appendChild(popup);
            
            setTimeout(() => {
                popup.remove();
            }, 1000);
        }

        // 显示连对奖励
        function showStreakBonus(streak) {
            const bonus = document.createElement('div');
            bonus.className = 'streak-bonus';
            bonus.textContent = streak + '连对!🔥';
            document.body.appendChild(bonus);
            
            setTimeout(() => {
                bonus.remove();
            }, 1000);
        }

        // 更新进度
        function updateProgress() {
            const percent = ((gameState.currentQuestion - 1) / gameState.totalQuestions) * 100;
            progressBar.style.width = percent + '%';
            progressText.textContent = `${gameState.currentQuestion}/${gameState.totalQuestions}`;
        }

        // 更新统计
        function updateStats() {
            document.getElementById('level-display').textContent = gameState.level;
            document.getElementById('score-display').textContent = gameState.score;
            document.getElementById('streak-display').textContent = gameState.streak;
        }

        // 更新奖励显示
        function updateRewardsDisplay() {
            document.getElementById('stars-count').textContent = gameState.stars;
            document.getElementById('trophies-count').textContent = gameState.trophies;
            document.getElementById('gems-count').textContent = gameState.gems;

            // 更新徽章
            const badges = [100, 500, 1000, 5000, 10000];
            badges.forEach((threshold, index) => {
                const badge = document.getElementById(`badge-${index + 1}`);
                if (gameState.score >= threshold) {
                    badge.classList.add('earned');
                    if (!gameState.badges.includes(index + 1)) {
                        gameState.badges.push(index + 1);
                        showReward('🏅');
                    }
                }
            });
        }

        // 完成关卡
        function completeLevel() {
            gameUI.style.display = 'none';
            levelComplete.style.display = 'block';

            // 计算奖励
            const accuracy = gameState.correctAnswers / gameState.totalQuestions;
            const stars = accuracy >= 0.9 ? 3 : accuracy >= 0.7 ? 2 : accuracy >= 0.5 ? 1 : 0;
            const gems = stars * 5;

            gameState.stars += stars;
            gameState.gems += gems;

            document.getElementById('level-stars').textContent = stars;
            document.getElementById('level-gems').textContent = gems;

            updateRewardsDisplay();
            saveProgress();
        }

        // 下一关
        function nextLevel() {
            gameState.level++;
            levelComplete.style.display = 'none';
            gameUI.style.display = 'block';
            gameState.currentQuestion = 0;
            gameState.correctAnswers = 0;
            updateStats();
            generateQuestion();
        }

        // 返回菜单
        function backToMenu() {
            levelComplete.style.display = 'none';
            startScreen.style.display = 'block';
        }

        // 保存进度
        function saveProgress() {
            localStorage.setItem('numberSenseProgress', JSON.stringify({
                level: gameState.level,
                score: gameState.score,
                stars: gameState.stars,
                trophies: gameState.trophies,
                gems: gameState.gems,
                badges: gameState.badges
            }));
        }

        // 加载进度
        function loadProgress() {
            const saved = localStorage.getItem('numberSenseProgress');
            if (saved) {
                const data = JSON.parse(saved);
                gameState.level = data.level || 1;
                gameState.score = data.score || 0;
                gameState.stars = data.stars || 0;
                gameState.trophies = data.trophies || 0;
                gameState.gems = data.gems || 0;
                gameState.badges = data.badges || [];
                updateStats();
                updateRewardsDisplay();
            }
        }

        // 启动
        init();
    </script>
</body>
</html>
